name: Municipal gap diagnostic
on:
  push:
    branches:
      - diag/municipal-gap-probe
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/municipal-gap-diagnostic.mjs
