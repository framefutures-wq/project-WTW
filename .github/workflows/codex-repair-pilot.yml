# Safety-first trial: runs only when repository owner manually starts it.
# Does not push, merge, deploy, write production D1, or automatically retry.
name: Codex repair pilot (manual)

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: "Existing internal PR number to inspect (e.g. 90)"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-repair-pilot
  cancel-in-progress: false

jobs:
  propose:
    if: ${{ github.repository == 'framefutures-wq/project-WTW' && github.actor == 'framefutures-wq' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject forked, closed or unrelated PRs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        shell: bash
        run: |
          set -euo pipefail
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "Invalid PR number" >&2; exit 1;; esac
          origin_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.repo.full_name')
          state=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.state')
          if [ "$origin_repo" != "$GITHUB_REPOSITORY" ] || [ "$state" != open ]; then
            echo "Only open PRs from this repository are allowed" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ inputs.pull_request }}/head
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install existing project dependencies
        run: npm ci

      - name: Request one bounded Codex repair
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          codex-args: '["--model", "gpt-5-codex-mini"]'
          prompt: |
            This is a low-budget diagnostic repair PILOT on internal PR #${{ inputs.pull_request }}.
            Read AGENTS.md, PROJECT_CONTEXT.md, NEXT_CHAT_HANDOFF.md and
            docs/WORKING_RULES.md only as needed for this one PR.
            Inspect the code change and relevant tests. Attempt at most ONE
            narrow fix for a failure directly caused by the PR's change.
            Pre-existing failures on main are NOT part of this task:
            do not "repair" unrelated baseline tests merely to turn CI green.
            You may edit only files under worker/, shared/, src/ or tests/.
            DO NOT edit .github/, scripts/, migrations/, Cloudflare settings,
            package manifests, or documentation.
            Do not deploy, call production services, alter D1, commit, or push.
            Run only the minimum targeted tests relevant to your proposed change.
            If the problem cannot be safely isolated, make NO file changes
            and explain why. Provide a short final summary with what was
            verified and what remains unknown.

      - name: Check patch scope and formatting
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --name-only > /tmp/codex-changed-files.txt
          if grep -Ev '^(worker|shared|src|tests)/' /tmp/codex-changed-files.txt; then
            echo "Blocked: Codex changed out-of-scope tracked files" >&2
            exit 1
          fi
          git diff --binary > codex-proposal.patch
          echo "Changed paths:"
          cat /tmp/codex-changed-files.txt

      - name: Save proposed patch for human verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codex-proposed-patch
          path: codex-proposal.patch
          if-no-files-found: ignore
          retention-days: 3
