name: Repair UI branch stale integration fixture
on:
  push:
    branches: [ui/fever-inspired-redesign]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/fever-inspired-redesign
      - name: Update obsolete cron integration assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/integration.mjs')
          s = p.read_text()
          old = '''  const cron = await mf.dispatchFetch(\n    "http://localhost/cdn-cgi/local/scheduled?cron=0+21+*+*+*",\n  );'''
          new = '''  const cron = await mf.dispatchFetch(\n    "http://localhost/cdn-cgi/local/scheduled?cron=0+1+*+*+*",\n  );'''
          if old not in s:
              raise SystemExit('legacy cron fixture not found')
          s = s.replace(old, new, 1)
          old_query = '''  const run = await db\n    .prepare(\n      "SELECT status,stale_count FROM sync_runs WHERE provider='maintenance'",\n    )\n    .first();'''
          new_query = '''  const run = await db\n    .prepare(\n      "SELECT status,stale_count FROM sync_runs WHERE provider='tourapi' AND id!='reject-test' ORDER BY started_at DESC LIMIT 1",\n    )\n    .first();'''
          if old_query not in s:
              raise SystemExit('legacy maintenance assertion not found')
          p.write_text(s.replace(old_query, new_query, 1))
          PY
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/integration.mjs
          git commit -m "test: align integration fixture with split cron"
          git push origin HEAD:ui/fever-inspired-redesign
