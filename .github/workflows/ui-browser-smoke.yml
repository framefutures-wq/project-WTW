name: UI browser smoke

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "shared/**"
      - "tests/browser/**"
      - "package.json"
      - "package-lock.json"
      - "playwright*.ts"
      - ".github/workflows/ui-browser-smoke.yml"
  pull_request:
    paths:
      - "src/**"
      - "shared/**"
      - "tests/browser/**"
      - "package.json"
      - "package-lock.json"
      - "playwright*.ts"
      - ".github/workflows/ui-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:ci
