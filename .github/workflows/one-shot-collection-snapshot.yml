name: One-shot read-only collection snapshot

on:
  push:
    branches:
      - ops/one-shot-collection-snapshot-20261021

permissions:
  contents: read

jobs:
  snapshot:
    if: ${{ github.repository == 'framefutures-wq/project-WTW' && github.ref == 'refs/heads/ops/one-shot-collection-snapshot-20261021' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Read fixed aggregate SELECTs and require zero writes
        env:
          CLOUDFLARE_D1_READ_TOKEN: ${{ secrets.CLOUDFLARE_D1_READ_TOKEN }}
        run: node scripts/collection-progress-audit.mjs
