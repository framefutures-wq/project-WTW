name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui:ci
      - name: Deploy verified app to existing production Worker
        run: npm run deploy:verified
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify production detail frame
        run: npm run test:ui:prod
        env:
          TEST_BASE_URL: https://galteum.com
          TEST_OUTPUT_DIR: test-results/production-audit
